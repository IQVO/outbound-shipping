# Used by `helm lint` / `ct lint` (chart-testing): the chart refuses to render
# without a database source, Kafka brokers and the six consumer groups (the
# real runtime). Dummy values, no password, never dialled.
database:
  url: "postgres://u@example.invalid:5432/db"
kafka:
  brokers: "kafka.example.invalid:9092"
config:
  fulfillmentConsumerGroup: "outbound-shipping-fulfillment"
  dockConsumerGroup: "outbound-shipping-dock"
  yardConsumerGroup: "outbound-shipping-yard"
  cptConsumerGroup: "outbound-shipping-cpt"
  layoutConsumerGroup: "outbound-shipping-layout"
  analyticsConsumerGroup: "outbound-shipping-analytics"
