# Non-secret configuration of the api component, mirrored from the env the
# Deployment renders; the Deployment's checksum/config annotation rolls the
# pods whenever any of it changes. DATABASE_URL never lands here: it lives in
# the Secret (templates/secret.yaml or database.existingSecret).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "outbound-shipping.fullname" . }}
  labels:
    {{- include "outbound-shipping.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
data:
  ADDR: {{ .Values.config.addr | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  KAFKA_BROKERS: {{ .Values.kafka.brokers | quote }}
  FULFILLMENT_CONSUMER_GROUP: {{ .Values.config.fulfillmentConsumerGroup | quote }}
  DOCK_CONSUMER_GROUP: {{ .Values.config.dockConsumerGroup | quote }}
  YARD_CONSUMER_GROUP: {{ .Values.config.yardConsumerGroup | quote }}
  CPT_CONSUMER_GROUP: {{ .Values.config.cptConsumerGroup | quote }}
  LAYOUT_CONSUMER_GROUP: {{ .Values.config.layoutConsumerGroup | quote }}
  ANALYTICS_CONSUMER_GROUP: {{ .Values.config.analyticsConsumerGroup | quote }}
  {{- if ne (toString .Values.config.outboxIntervalMs) "" }}
  OUTBOX_INTERVAL_MS: {{ .Values.config.outboxIntervalMs | quote }}
  {{- end }}
  {{- if ne (toString .Values.config.outboxBatch) "" }}
  OUTBOX_BATCH: {{ .Values.config.outboxBatch | quote }}
  {{- end }}
  {{- if ne (toString .Values.config.outboxMaxAttempts) "" }}
  OUTBOX_MAX_ATTEMPTS: {{ .Values.config.outboxMaxAttempts | quote }}
  {{- end }}
