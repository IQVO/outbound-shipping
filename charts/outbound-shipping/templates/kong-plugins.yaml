{{- /*
Kong plugins owned by this application's chart.

Fleet decision (2026-10-13): ALL Kong configuration (routes AND plugins)
belongs to the application's Helm chart, not warehouse-infra Terraform:
chart-rendered objects are Helm/ArgoCD reconciled forever, kubectl-applied
ones silently vanish on a cluster rebuild. Namespace-scoped KongPlugin CRs
here are the same mechanism, self-healing.

Three plugins, one per concern, attached per-route via the
`konghq.com/plugins` annotation on this chart's own HTTPRoute templates:

  cors          exact origin only, NEVER "*" (endpoints are unauthenticated).
  prometheus    per-route RED metrics on Kong's :8100 status listener.
  opentelemetry OTLP traces to the fleet collector; needs Kong started
                with KONG_TRACING_INSTRUMENTATIONS.

NO auth plugin, deliberately: authentication/authorization was removed
fleet-wide and the standing decision is that the gateway adds none.

All three default `enabled: false` here and are switched on by
warehouse-infra's values, so this chart stays installable standalone.
*/ -}}
{{- range $name, $cfg := .Values.kongPlugins }}
{{- if $cfg.enabled }}
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: {{ printf "%s-%s" (include "outbound-shipping.fullname" $) $name }}
  labels:
    {{- include "outbound-shipping.labels" $ | nindent 4 }}
  annotations:
    kubernetes.io/ingress.class: kong
{{- if eq $name "cors" }}
plugin: cors
config:
  origins:
    - {{ $cfg.origin | quote }}
  methods:
    - GET
    - POST
    - PUT
    - PATCH
    - DELETE
    - OPTIONS
  headers:
    - Accept
    - Content-Type
    - Origin
    # A custom request header is not CORS-safelisted: every POST of the REST
    # API takes an Idempotency-Key and the preflight must allow it or the
    # browser blocks the call before it reaches Kong.
    - Idempotency-Key
{{- else if eq $name "prometheus" }}
plugin: prometheus
config:
  per_consumer: false
{{- else if eq $name "opentelemetry" }}
plugin: opentelemetry
config:
  endpoint: {{ $cfg.tracesEndpoint | quote }}
  resource_attributes:
    service.name: {{ printf "%s-%s" (include "outbound-shipping.fullname" $) "kong" | quote }}
{{- end }}
---
{{- end }}
{{- end }}
